name: Publish BIOC557 teaching lab
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: bioc557-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout teaching site
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static teaching site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
